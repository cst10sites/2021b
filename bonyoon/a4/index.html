<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CookieClicker</title>
<link rel="stylesheet" href="cookieclicker.css">
<style type="text/css">
  #content {
    width: 200px;
    border: 1px dashed #dc0000;
    font-size: 20px;
    text-align: center;
    margin: 0 auto;
    margin-top: 50px;
    padding: 20px;
    user-select: none;
  }
	
  #clickarea {
    width: 500px;
    height : 300px;
    border: 2px solid #dc0000;
    font-size: 20px;
    text-align: center;
    margin: 0 auto;
    margin-top: 0px;
    padding: 0px;
    position: relative;
  }
  
  #background {
    width:500px;
    height: 300px;
    margin: 0 auto;
    margin-top: 0px;
    display: block;
    user-select: none;
  }
   
 
	
  #logo {
    width: 200px;
    height: 200px;
    margin: 0 auto;
    margin-top: 50px;
    display: block;
    user-select: none;
  }
	
  #start {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    border: 0;
    line-height: 2.5;
    padding: 0 20px;
    font-size: 1rem;
    text-align: center;
    color: #fff;
    text-shadow: 1px 1px 1px #000;
    border-radius: 10px;
    background-color: rgba(220, 0, 0, 1);
    background-image: linear-gradient(to top left,
				  rgba(0, 0, 0, .2),
				  rgba(0, 0, 0, .2) 30%,
				  rgba(0, 0, 0, 0));
    box-shadow: inset 2px 2px 3px rgba(255, 255, 255, .6),
                inset -2px -2px 3px rgba(0, 0, 0, .6);
  }
  
  
	
  #start:hover {
    background-color: rgba(255, 0, 0, 1);
  }
	
  #start:active {
    box-shadow: inset -2px -2px 3px rgba(255, 255, 255, .6),
                inset 2px 2px 3px rgba(0, 0, 0, .6);
  }

</style>
</head>
<body>
<h1>Cookie Clicker!</h1>
  <img id="logo" src="cookies.jpg" />
  <div id="content">
    Timer: <span id="timer"></span><br/>
    
    Clicks/s: <span id="clicks"></span>
  </div>
  <h2 id="comment"></h2>
  <div id="clickarea">
    <button id="start">Start</button> 
	<img id="background" src="batchofcookies.jpg" />
	
  </div>
  <script type="text/javascript">
    var score; 
    var duration = 10; 
    var startTime; 
    var ended = true; 
    
    var timerTxt = document.getElementById("timer");
    var scoreTxt = document.getElementById("score");
    var clicksTxt = document.getElementById("clicks");
    var startBtn = document.getElementById("start");
    var clickArea = document.getElementById("clickarea");

    
    var show = function(elem) {
      elem.style.display = 'inline';
    };

    var hide = function(elem) {
      elem.style.display = 'none';
    };

    
    
	
	function startGame() {
      hide(startBtn);
      score = -1;
      ended = false;
      
      startTime = new Date().getTime();

      
      var timerId = setInterval(function() {
        var total = (new Date().getTime() - startTime) / 1000;
		
		var clicksPerSecond = (score / total).toFixed(2);


		
        if (total < duration) {
          timerTxt.textContent = total.toFixed(3);
          clicksTxt.textContent = clicksPerSecond;
		  if (clicksPerSecond < 3) {
			document.getElementById('comment').innerHTML = "Click faster!!!";
		  }
		 if (clicksPerSecond > 4) {
		 document.getElementById('comment').innerHTML = "nice pace!!!";
		 }
		 if (clicksPerSecond > 6) {
		 document.getElementById('comment').innerHTML = "Amazing Job!!!";
		 }
		  
        } else {
		
          
          ended = true;
          clearInterval(timerId);
          
          endGame();
        }
      }, 1);
  }

  
  function endGame() {
  
    var clicsBySeconds = (score / duration).toFixed(2);
    timerTxt.textContent = duration.toFixed(3);
    clicksTxt.textContent = clicsBySeconds;

    show(startBtn);

    setTimeout(function() {
      alert('You got ' + score + ' Cookies ' + duration + 
      ' seconds. That is ' + clicsBySeconds + 
      ' cookies per seconds. Try again!');
    }, 10);
  }

 
  startBtn.addEventListener("click", function(e) {
    startGame();
  });

 
  clickArea.addEventListener("click", function(e) {
    if (!ended) {
      score++;
      scoreTxt.textContent = score;
    }
  });
</script>
</body>
</html>
