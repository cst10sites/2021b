<h1>Civilization VI Guide - Quiz</h1>
<div class="main2">
<form>
<label for="q1">What unit is used to found cities?</label>
<br>
<select id="q1" name="q1">
  <option value="0">Builder</option>
  <option value="0">Warrior</option>
  <option value="1">Settler</option>
  <option value="0">Scout</option>
</select>
<br>
<label for="q2">What is used to research technologies?</label>
<br>
<select id="q2" name="q2">
  <option value="0">Culture</option>
  <option value="1">Science</option>
  <option value="0">Food</option>
  <option value="0">Amenities</option>
</select>
<br>
<label for="q3">What unit is used to spread religion?</label>
<br>
<select id="q3" name="q3">
  <option value="0">Settler</option>
  <option value="0">Warrior</option>
  <option value="0">Slinger</option>
  <option value="1">Missionary</option>
</select>
<br>
<label for="q4">What resource type gives amenities?</label>
<br>
<select id="q4" name="q4">
  <option value="1">Luxury</option>
  <option value="0">Strategic</option>
  <option value="0">Bonus</option>
</select>
<br>
<label for="q5">Which victory condition involves Space Race missions?</label>
<br>
<select id="q5" name="q5">
  <option value="0">Domination Victory</option>
  <option value="1">Science Victory</option>
  <option value="0">Religion Victory</option>
  <option value="0">Culture Victory</option>
</select>
</form>
<button onclick="submitQuiz()">Submit</button>
<p id="score"></p>
</div>
