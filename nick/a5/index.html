<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UFT-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="text-align: center;">
<h1>Tip Calculator</h1>

<p>Subtotal</p>
<form>
<input type="text" id="tbt">
<p> + GTS(5%)</p>
<p id="tat"><p>
<br>

<label for="tip">Tip</label>

<p><select name="tip" id="tips">
	<option value="1.00">No Tip</option>
	<option value="1.10">Average</option>
	<option value="1.15">Good</option>
	<option value="1.20">Excellent</option>
</select></p>

<p id="totalaftertip"></p>
<br>

<p><label for="split">Split</label></p>
<p><select name="split" id="split"></p>
	<option value="1">1</option>
	<option value="2">2</option>
	<option value="3">3</option>
	<option value="4">4</option>
	<option value="5">5</option>
	<option value="6">6</option>
</select>
<p id="aftersplit"></p>
<br>

<p>
  <input type="submit" onclick="clickedSubmit(); return false;">
  <input type="reset" onclick="totalReset();">
</form></p>
<script src="script.js"></script>

</div>
</body>
</html>
